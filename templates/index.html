<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Etiquetas</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 1500px;
            gap: 30px;
        }
        .section {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .question {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: center;
        }
        .options {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            font-size: 24px;
            align-items: center;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .options input[type="radio"] {
            transform: scale(1.6);
            accent-color: #ff4d4d;
            cursor: pointer;
        }
        .image-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .image-container img {
            width: 100%;
            max-width: 700px;
            height: auto;
            border-radius: 4px;
        }
        .footer-text {
            margin-top: 12px;
            font-size: 20px;
            color: #cccccc;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Seção Esquerda: Descrição -->
        <div class="section">
            <div class="question">
                📌 A descrição está correta?
            </div>
            <div class="options">
                <label><input type="radio" name="q1" checked> Selecione...</label>
                <label><input type="radio" name="q1"> Sim</label>
                <label><input type="radio" name="q1"> Não</label>
            </div>
            <div class="image-container">
                <img src="{{ url_for('static', filename='descricao07.png') }}" alt="Ref Descrição">
            </div>
            <div class="footer-text">Ref. Descrição</div>
        </div>

        <!-- Seção Direita: Ordem -->
        <div class="section">
            <div class="question">
                📌 Você verificou a ordem?
            </div>
            <div class="options">
                <label><input type="radio" name="q2" checked> Selecione...</label>
                <label><input type="radio" name="q2"> Sim</label>
                <label><input type="radio" name="q2"> Não</label>
            </div>
            <div class="image-container">
                <img src="{{ url_for('static', filename='ordem08.png') }}" alt="Ref Ordem">
            </div>
            <div class="footer-text">Ref. Ordem</div>
        </div>
    </div>

</body>
</html>
